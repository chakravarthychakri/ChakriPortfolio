<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Animation Showcase</title>
</head>
<body>

<h1>CSS Animation Showcase</h1>

<div class="section">
    <h2 class="fade">Fade In Animation</h2>
</div>

<div class="section">
    <h2 class="slide">Slide In Animation</h2>
</div>

<div class="section">
    <div class="ball"></div>
    <p>Bounce Animation</p>
</div>

<div class="section">
    <div class="pulse"></div>
    <p>Pulse Animation</p>
</div>

<div class="section">
    <div class="rotate"></div>
    <p>Rotate Animation</p>
</div>

<div class="section">
    <div class="float">🚀</div>
    <p>Floating Animation</p>
</div>

<div class="section">
    <h2 class="typing">Welcome to CSS Animations</h2>
</div>

<div class="section">
    <button class="glow-btn">Glowing Button</button>
</div>

<div class="section">
    <div class="card">
        <h3>Hover Me</h3>
        <p>Card Hover Animation</p>
    </div>
</div>

<div class="section">
    <div class="loader"></div>
    <p>Loading Spinner</p>
</div>

<div class="section">
    <div class="progress-container">
        <div class="progress"></div>
    </div>
    <p>Progress Bar Animation</p>
</div>

<div class="section">
    <div class="zoom">🔥</div>
    <p>Zoom Animation</p>
</div>

<div class="section">
    <div class="shake">Shake</div>
</div>

<div class="section">
    <div class="color-box"></div>
    <p>Color Change Animation</p>
</div>

</body>
</html>
